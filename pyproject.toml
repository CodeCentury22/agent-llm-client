[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-llm-client"
version = "0.5.16"
description = "Unified client interface supporting local (Ollama) and cloud (Gemini) LLM completion and embeddings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.0",
    "agent-workspace-tools"
]

[tool.uv.sources]
agent-workspace-tools = { git = "https://github.com/CodeCentury22/agent-workspace-tools.git", tag = "v0.2.2" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]